name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm comes from Node's corepack (version pinned by package.json "packageManager"),
      # so the repo only needs GitHub-owned actions.
      - name: Enable pnpm via corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - run: pnpm install --frozen-lockfile
      - name: Parser smoke test (no network)
        run: python3 -I -m py_compile scripts/cmvp_lib.py scripts/cmvp_crawl.py scripts/build_site_data.py
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 -I scripts/build_site_data.py
      - run: pnpm build
