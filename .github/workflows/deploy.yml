name: Deploy

# Builds the site from the committed dataset in data/ and publishes it to GitHub Pages.
# Runs on pushes to main, on demand, and when update-data.yml commits new records
# (pushes made with GITHUB_TOKEN don't trigger workflows, so that one calls this directly).
on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pick up the commit update-data.yml just pushed

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm comes from Node's corepack (version pinned by package.json "packageManager"),
      # so the repo only needs GitHub-owned actions.
      - name: Enable pnpm via corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - run: pnpm install --frozen-lockfile

      - name: Build site data (data/ -> public/data/)
        run: python3 -I scripts/build_site_data.py

      - name: Build site
        # BASE_PATH must match the Pages URL: / for the custom domain (cmvpcerts.net; the github.io
        # address redirects there), /<repo>/ for a plain project site.
        env:
          BASE_PATH: /
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # deploy-pages looks the artifact up through the API right after the upload finalizes,
      # and that lookup can briefly miss it ("No artifacts named github-pages were found").
      # Give the API a moment to catch up.
      - name: Wait for the Pages artifact to register
        run: sleep 15

      - id: deploy
        uses: actions/deploy-pages@v4
